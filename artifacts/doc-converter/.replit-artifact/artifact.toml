kind = "web"
previewPath = "/"
title = "DocConvert — Image & Document Converter"
version = "1.0.0"
id = "artifacts/doc-converter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23212

[services.development]
run = "pnpm --filter @workspace/doc-converter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doc-converter", "run", "build" ]
publicDir = "artifacts/doc-converter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23212"
BASE_PATH = "/"
